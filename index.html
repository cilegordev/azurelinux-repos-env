<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Index of /</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: white;
      background-color: #1c1b22;
      overflow-x: hidden;
    }

    @keyframes fadeInFromLeft {
      from { opacity: 0; transform: translateX(-20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeInFromRight {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    @keyframes fadeInFromBottomLeft {
      from { opacity: 0; transform: translate(-20px, 20px); }
      to   { opacity: 1; transform: translate(0, 0); }
    }

    .image-wrapper {
      position: absolute;
      top: 0;
      right: -70px;
      left: auto;
      height: 100%;
      aspect-ratio: var(--img-ratio, 1.6);
      z-index: 0;
      animation: fadeInFromRight 1s ease-out forwards;
      overflow: hidden;
    }

    .image-blend {
      position: relative;
      height: 100%;
    }

    .image-blend::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 70%;
      background: linear-gradient(to right, #1c1b22 0%, transparent 100%);
      z-index: 2;
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      opacity: 0;
      transform: translateX(60px);
      transition: opacity 1s ease, transform 1s ease;
      pointer-events: none;
    }

    .slide-img.active {
      opacity: 1;
      transform: translateX(0);
      z-index: 1;
    }

    .slide-img.exiting {
      opacity: 0;
      transform: translateX(-60px);
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      padding: 38px 28px;
      max-width: 600px;
      animation: fadeInFromLeft 1s ease-out forwards;
    }

    h1 {
      font-size: 1.6em;
      margin-bottom: 10px;
      font-weight: 600;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

  li {
    display: flex;
    align-items: center;
    padding: 6px 8px;
    margin-bottom: 4px;   
  }

    li:last-child {
      border-bottom: none;        
    }

    .icon {
      display: inline-block;
      width: 1.2em;
      margin-right: 0.5em;
    }

    a {
      text-decoration: none;
      color: #4ea8ff;
      font-weight: 500;
      flex: 1;                    
    }

    a:hover {
      text-decoration: underline;
    }

    .corner-icons {
      position: fixed;
      bottom: 10px;
      left: 10px;
      display: flex;
      gap: 10px;
      z-index: 3;
      animation: fadeInFromBottomLeft 1s ease-out forwards;
    }

    .corner-icons img {
      width: 28px;
      height: 28px;
      opacity: 0.8;
      transition: opacity 0.3s ease;
    }

    .corner-icons img:hover {
      opacity: 1;
    }

    @media screen and (max-height: 500px) and (orientation: landscape) {
      .image-wrapper, .content, .corner-icons {
        animation: none;
      }
      .image-blend::before {
        width: 70%;
      }
    }

    @media screen and (orientation: portrait) {
      .image-wrapper {
        left: 0;
        right: auto;
        top: 0;
        width: 100vw;
        height: 100vh;
        animation: none;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        overflow: hidden;
      }

      .image-blend {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: flex-start;
        align-items: flex-start;
        position: relative;
      }

      .image-blend::before {
        background: linear-gradient(to right, #1c1b22 0%, transparent 100%);
        left: 0;
        right: auto;
        width: 40%;
      }

      .slide-img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: left top;
      }

      .content, .corner-icons {
        animation: none;
      }
    }
  </style>
  <link rel="icon" href="https://raw.githubusercontent.com/microsoft/azurelinux/refs/heads/3.0/SPECS/calamares/azl-logo.png" type="image/x-icon">
</head>
<body>
  <div class="image-wrapper">
    <div class="image-blend">
      <img class="slide-img active" src="https://raw.githubusercontent.com/cilegordev/cilegordev/refs/heads/main/assets/calamares2.png" alt="Image Preview" />
      <img class="slide-img" src="https://raw.githubusercontent.com/cilegordev/cilegordev/refs/heads/main/assets/calamares1.png" alt="Image Preview" />
      <img class="slide-img" src="https://raw.githubusercontent.com/cilegordev/cilegordev/refs/heads/main/assets/calamares3.png" alt="Image Preview" />
    </div>

  <div class="content">

    <ul>
      <li><img src="https://github.com/fluidicon.png" alt="icon" class="icon" style="width: 16px; height: 16px; vertical-align: middle; margin-right: 4px;"><a href="https://www.github.com/cilegordev/azurelinux-repos-env">.@github</a></li>

  <div class="corner-icons">

    <img src="https://upload.wikimedia.org/wikipedia/commons/9/90/X.Org_Logo.svg" alt="X.Org Logo">

  <script>
    (function () {
      function applyRatio(img) {
        if (img.naturalWidth && img.naturalHeight) {
          document.documentElement.style.setProperty(
            '--img-ratio',
            (img.naturalWidth / img.naturalHeight).toFixed(4)
          );
        }
      }

      const firstSlide = document.querySelector('.slide-img.active');
      if (firstSlide) {
        if (firstSlide.complete) {
          applyRatio(firstSlide);
        } else {
          firstSlide.addEventListener('load', function () {
            applyRatio(firstSlide);
          });
        }
      }

      const slides = document.querySelectorAll('.slide-img');
      let current = 0;

      if (slides.length > 1) {
        setInterval(function () {
          const outgoing = slides[current];
          outgoing.classList.remove('active');
          outgoing.classList.add('exiting');

          current = (current + 1) % slides.length;
          slides[current].classList.add('active');
          if (slides[current].complete) {
            applyRatio(slides[current]);
          } else {
            slides[current].addEventListener('load', function () {
              applyRatio(slides[current]);
            });
          }

          setTimeout(function () {
            outgoing.classList.remove('exiting');
          }, 1000);
        }, 10000);
      }
    })();
  </script>
</body>
</html>
